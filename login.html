<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NexusBlog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon"><i class="fa-solid fa-cube"></i></div>
        <span>Nexus<span class="gradient-text">Blog</span></span>
      </a>
      <div class="nav-actions" id="nav-actions-wrap">
        <!-- Rendered by JS -->
      </div>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="fa-solid fa-right-to-bracket"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Log in to manage your blog posts and analytics</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="email" class="input-control" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="input-control" placeholder="••••••••" required>
            <button type="button" class="toggle-pwd-btn"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember"> Remember me
          </label>
          <a href="#" onclick="appEngine.showToast('Password reset link sent to demo email', 'info')" style="color: var(--primary);">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>

        <button type="button" id="demo-login-btn" class="btn btn-secondary" style="width: 100%;">
          <i class="fa-solid fa-bolt" style="color: var(--amber);"></i> Quick Demo Login
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html">Create an Account</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
