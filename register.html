<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NexusBlog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon"><i class="fa-solid fa-cube"></i></div>
        <span>Nexus<span class="gradient-text">Blog</span></span>
      </a>
      <div class="nav-actions" id="nav-actions-wrap">
        <!-- Rendered by JS -->
      </div>
    </div>
  </header>

  <!-- Register Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1>Create Your Account</h1>
        <p>Join the NexusBlog writer community</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Choose Avatar</label>
          <div class="avatar-picker">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="avatar-option selected" alt="Avatar 1">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" class="avatar-option" alt="Avatar 2">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" class="avatar-option" alt="Avatar 3">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80" class="avatar-option" alt="Avatar 4">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="reg-name" class="input-control" placeholder="Alex Dev" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="reg-email" class="input-control" placeholder="alex@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="reg-password" class="input-control" placeholder="••••••••" required>
            <button type="button" class="toggle-pwd-btn"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="pwd-strength-meter">
            <div id="pwd-strength-bar" class="pwd-strength-bar"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-check-double input-icon"></i>
            <input type="password" id="reg-confirm-password" class="input-control" placeholder="••••••••" required>
            <button type="button" class="toggle-pwd-btn"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" required checked> I agree to the Terms & Privacy
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Create Account <i class="fa-solid fa-user-check"></i>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In Instead</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
